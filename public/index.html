<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4ade80" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FR-15" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- App info -->
    <meta name="description" content="Real-time bus arrivals for FR-15 Khanna Pul ↔ T-Chowk Islamabad" />
    <title>FR-15 Bus Tracker</title>
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('FR-15 PWA ready ✓'))
            .catch(e => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
